- id: naclip
  title: "Pay Attention to Your Neighbours: Training-Free Open-Vocabulary Semantic Segmentation"
  authors: "Hajimiri, S., Ben Ayed, I., and Dolz, J."
  venue: "WACV 2025"
  venue_full: "IEEE/CVF Winter Conference on Applications of Computer Vision, 2025"
  first_author: true
  tldr: "NACLIP: training-free open-vocabulary segmentation by making CLIP's vision transformer attend to each patch's spatial neighbourhood. No extra data, auxiliary networks, or heavy hyperparameter tuning; state of the art on most of eight benchmarks at publication."
  links:
    - name: paper
      url: https://arxiv.org/abs/2404.08181
    - name: code
      url: https://github.com/sinahmr/NACLIP

- id: clap
  title: "A Closer Look at the Few-Shot Adaptation of Large Vision-Language Models"
  authors: "Silva-Rodriguez, J., Hajimiri, S., Ben Ayed, I., and Dolz, J."
  venue: "CVPR 2024"
  venue_full: "IEEE/CVF Conference on Computer Vision and Pattern Recognition, 2024"
  tldr: "Few-shot adaptation methods for CLIP depend on tuning with large labeled validation sets; without it they often lose to a linear probe. We propose CLAP, a class-adaptive linear probe that is more robust and efficient."
  links:
    - name: paper
      url: https://arxiv.org/abs/2312.12730
    - name: code
      url: https://github.com/jusiro/CLAP

- id: diam
  title: "A Strong Baseline for Generalized Few-Shot Semantic Segmentation"
  authors: "Hajimiri, S., Boudiaf, M., Ben Ayed, I., and Dolz, J."
  venue: "CVPR 2023"
  venue_full: "IEEE/CVF Conference on Computer Vision and Pattern Recognition, 2023"
  first_author: true
  tldr: "DIaM: an InfoMax-based inference procedure with knowledge distillation that runs on top of any segmentation network trained on base classes. Improves novel-class performance by 7–26% on PASCAL-5i and 3–12% on COCO-20i."
  links:
    - name: paper
      url: https://arxiv.org/abs/2211.14126
    - name: code
      url: https://github.com/sinahmr/DIaM
