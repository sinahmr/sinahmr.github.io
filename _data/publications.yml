- id: budget-web-agents
  title: "Are Online Skill and Memory Modules Always Worth Their Tokens? A Budget-Constrained Study of Web Agents"
  authors: "Hajimiri, S., Aminbeidokhti, M., Dolz, J., Ben Ayed, I., Laradji, I. H., Gella, S., and Gontier, N."
  venue: "EMNLP 2026"
  venue_full: "Conference on Empirical Methods in Natural Language Processing (main conference), 2026"
  first_author: true
  tldr: "Online memory, workflow, and skill modules for web agents cost tokens on every step. Under a matched inference-token budget, a plain agent that spends those tokens on extra actor steps matches or beats AWM, ASI, and ReasoningBank across four WebArena domains and three LLMs, often with fewer total tokens. Run-to-run variance is large enough to flip which method wins."
  links:
    - name: paper
      url: https://arxiv.org/abs/2606.15017
    - name: code
      url: https://github.com/ServiceNow/budget-constrained-web-agents
    - name: project page
      url: /budget-constrained-web-agents/

- id: agenthorizon
  title: "AgentHorizon: Evaluating Agentic Judges for Long-Horizon Computer-Use Agent Tasks"
  authors: "Lù, X., Vattikonda, D., Hajimiri, S., Pesaran zadeh, F., BehnamGhader, P., Darwiche, G., Kazemnejad, A., Pal, C., Drouin, A., and Reddy, S."
  venue: "Under review"
  venue_full: "arXiv preprint, 2026"
  tldr: "A benchmark of 1,373 long-horizon computer-use tasks built from human-recorded trajectories across three operating systems. Judges must tell a successful trajectory apart from one that completed a similar but incompatible request. We evaluate LLM judges, both on full trajectories and as tool-using coding agents."
  links:
    - name: paper
      url: https://arxiv.org/abs/2610.11050
    - name: code
      url: https://github.com/ServiceNow/agenthorizon

- id: locatvit
  title: "Locality-Attending Vision Transformer"
  authors: "Hajimiri, S., Beizaee, F., Shakeri, F., Desrosiers, C., Ben Ayed, I., and Dolz, J."
  venue: "ICLR 2026"
  venue_full: "International Conference on Learning Representations, 2026"
  first_author: true
  tldr: "A minor change to ViTs' architecture for better dense prediction: a learnable Gaussian bias makes each patch attend more to its neighbours while keeping global context, and patch representations are refined. Improves segmentation of classification-trained ViTs (over 6% on ADE20K for ViT-Tiny, 4% for ViT-Base) without hurting classification accuracy."
  links:
    - name: paper
      url: https://arxiv.org/abs/2603.04892
    - name: code
      url: https://github.com/sinahmr/LocAtViT
    - name: huggingface
      url: https://huggingface.co/papers/2603.04892

